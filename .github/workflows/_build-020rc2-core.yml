# ============================================================================
# 【可复用核心】编译 DSHA v0.2.0-rc2（build170）
#
# 本文件不直接运行，由两个入口调用：
#   .github/workflows/rebuild-020rc2-signed.yml    ← push 自动触发 →【已签名】APK
#   .github/workflows/rebuild-020rc2-unsigned.yml  ← 仅手动触发   →【未签名】APK
#
# 为什么需要适配：DSHA 构建依赖的离线固定输入（offline-rootfs.bin 源 rootfs、
# dsh-runtime.bin、ubuntu-tools.bin 等）仓库不提交、原 CI 从开发者私有 asset bundle
# 恢复。本工作流改用「官方发布 APK 内嵌的离线资产」，因此：
#   * 不需要任何私有资产包 URL；
#   * 未签名版不需要密钥；签名版缺省用自动生成并缓存的密钥，也可用仓库 secrets 指定；
#   * 逐条目对比官方 APK（除签名与记账字段）。
# ============================================================================
name: (core) build v0.2.0-rc2

on:
  workflow_call:
    inputs:
      sign:
        description: 是否签名；false 只产出未签名 APK
        required: false
        default: false
        type: boolean
      official_apk_url:
        description: 官方 APK 地址（离线资产来源），留空用默认
        required: false
        default: ''
        type: string
      official_apk_sha256:
        description: 官方 APK 的 SHA-256，留空用默认
        required: false
        default: ''
        type: string
    secrets:
      DSHA_KEYSTORE_BASE64:
        required: false
      DSHA_KEYSTORE_PASSWORD:
        required: false
      DSHA_KEY_PASSWORD:
        required: false
      DSHA_KEY_ALIAS:
        required: false
    outputs:
      artifact:
        description: 上传的 artifact 名
        value: ${{ jobs.build.outputs.artifact }}
      apk_file:
        description: APK 文件名
        value: ${{ jobs.build.outputs.apk_file }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact: ${{ steps.pkg.outputs.artifact }}
      apk_file: ${{ steps.pkg.outputs.apk_file }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 核对源码版本（必须是 v0.2.0-rc2 / build170）
        run: |
          set -euo pipefail
          grep -E "dshaApkNameVersion|versionCode|versionName" app/build.gradle | head -5
          grep -q "dshaApkNameVersion = '0.2.0-rc2'" app/build.gradle \
            || { echo "::error::仓库不是 v0.2.0-rc2，本工作流只适配该版本"; exit 1; }
          {
            echo "### DSHA v0.2.0-rc2 适配构建"
            echo ""
            echo "- 源码：\`$GITHUB_SHA\`"
            echo "- 版本：\`$(grep -o 'versionName \"[^\"]*\"' app/build.gradle | head -1)\`"
            echo "- 离线资产来源：官方发布 APK 内嵌资产"
            echo "- 产物类型：${{ inputs.sign == true && '已签名' || '未签名' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: 安装 SDK platform 37 + build-tools 36（standard 构建无需 NDK）
        run: |
          set -euo pipefail
          # ubuntu-24.04 runner 已预装 Android SDK；cmdline-tools 不在 PATH 上，需显式导出。
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          echo "SDK_ROOT=$SDK_ROOT"; sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'app/build.gradle', 'settings.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 缓存本地签名密钥（仅签名版；多次构建签名一致、可覆盖安装）
        if: ${{ inputs.sign }}
        uses: actions/cache@v4
        with:
          path: .adapted-build
          key: dsha-adapted-keystore-v1

      - name: 从官方 APK 恢复离线构建输入
        env:
          APK_URL: ${{ inputs.official_apk_url || 'https://github.com/DSH-APP/DSHA/releases/download/v0.2.0-rc2/dsha-0.2.0-rc2.apk' }}
          APK_SHA: ${{ inputs.official_apk_sha256 || '1fedf883d431af658d89c28b86d85974cc1d11b74e0c5d46ef3d3cf8650b1961' }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o /tmp/official.apk "$APK_URL"
          if [ -n "${APK_SHA:-}" ]; then
            echo "${APK_SHA}  /tmp/official.apk" | sha256sum -c - \
              || { echo "::error::官方 APK 摘要不符，请更新 official_apk_sha256 输入"; exit 1; }
          fi
          mkdir -p /tmp/extracted
          # 只取「非生成物」的离线输入；offline-rootfs.bytes/.sha256/.layout 与
          # dsh-runtime.sha256 是构建生成物，放进源目录会被 asset-deployment 校验拒绝。
          unzip -o /tmp/official.apk \
            "assets/offline-rootfs.bin" \
            "assets/dsh-runtime.bin" \
            "assets/ubuntu-tools.bin" \
            "assets/ubuntu-tools.layout" \
            "assets/ubuntu-tools.manifest.json" \
            -d /tmp/extracted
          cp /tmp/extracted/assets/* app/src/main/assets/
          ls -la app/src/main/assets/ | grep -E "offline-rootfs.bin|dsh-runtime.bin|ubuntu-tools"

      - name: 重建受管输入元数据与运行时描述符
        run: |
          set -euo pipefail
          python3 -B tools/regenerate-input-metadata.py
          ( cd tools && python3 -B prepare-runtime-descriptor.py --write && python3 -B prepare-runtime-descriptor.py --check )

      - name: 构建前契约检查
        run: |
          set -euo pipefail
          python3 -B tools/prepare-runtime-tools.py --check
          python3 -B tools/generate-builtin-plugins.py --verify
          python3 -B tools/generate-credential-paths.py --check
          python3 -B tools/prepare-backup-assets.py --check

      - name: 构建未签名 standard release
        run: |
          set -euo pipefail
          chmod +x gradlew
          # 用 SDK 自带 aapt2：gradle/verification-metadata.xml 是在 Windows 上生成的，
          # 只登记了 aapt2-*-windows.jar，Linux 上按默认走 Maven aapt2 会触发依赖校验失败。
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" version
          ./gradlew :app:assembleStandardRelease -Pdsha.unsignedPackage=true \
            -Pandroid.aapt2FromMavenOverride="$AAPT2" --console=plain --no-daemon

      - name: 收集未签名产物
        run: |
          set -euo pipefail
          mkdir -p dist
          UNSIGNED=$(ls app/build/outputs/apk/standard/release/*-unsigned.apk | head -1)
          cp "$UNSIGNED" dist/dsha-0.2.0-rc2-unsigned.apk
          echo "unsigned=${UNSIGNED##*/} $(stat -c%s "$UNSIGNED") bytes"

      - name: 签名并校验（仅签名版）
        id: sign
        if: ${{ inputs.sign }}
        env:
          KEY_BASE64: ${{ secrets.DSHA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DSHA_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DSHA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DSHA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED=$(ls app/build/outputs/apk/standard/release/*-unsigned.apk | head -1)
          mkdir -p .adapted-build
          KS=.adapted-build/signing.keystore
          : "${KS_PASS:=dsha-adapted}"
          : "${KEY_PASS:=dsha-adapted}"
          : "${KEY_ALIAS:=androiddebugkey}"
          if [ -n "${KEY_BASE64:-}" ]; then
            printf '%s' "$KEY_BASE64" | base64 --decode > "$KS"
            echo "签名密钥来源：仓库 secrets"
          elif [ -f "$KS" ]; then
            echo "签名密钥来源：Actions 缓存（此前已生成）"
          else
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=DSHA Adapted Build, OU=DSHA, O=DSHA, C=CN"
            echo "签名密钥来源：本次自动生成（随缓存持久化）"
          fi
          OUT=dist/dsha-0.2.0-rc2-signed.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out "$OUT" "$UNSIGNED"
          "$BT/apksigner" verify --print-certs "$OUT" | head -6
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package:" || true
          # 签名版 artifact 只留签名产物，与未签名版分开
          rm -f dist/dsha-0.2.0-rc2-unsigned.apk
          ls -la dist/

      - name: 汇总产物与校验和
        id: pkg
        env:
          SIGNED: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          APK=$(ls *.apk | head -1)
          echo "apk_file=$APK" >> "$GITHUB_OUTPUT"
          if [ "$SIGNED" = "true" ]; then
            echo "artifact=dsha-0.2.0-rc2-signed" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=dsha-0.2.0-rc2-unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: 与官方 APK 逐条目对比
        run: |
          set -euo pipefail
          CAND=$(ls dist/*.apk | head -1)
          echo "对比候选: $CAND"
          python3 - "$CAND" /tmp/official.apk <<'PY' | tee /tmp/compare.txt
          import subprocess, re, sys
          def listing(apk):
              out = subprocess.run(["unzip", "-lv", apk], capture_output=True, text=True).stdout
              rows = {}
              for line in out.splitlines()[3:]:
                  m = re.match(r"^\s*(\d+)\s+(\S+)\s+(\d+)\s+(\d+)%\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}\s+([0-9a-f]{8})\s+(.+)$", line)
                  if m:
                      rows[m.group(6).strip()] = (int(m.group(1)), m.group(5))
              return rows
          a, b = listing(sys.argv[2]), listing(sys.argv[1])
          same = sum(1 for n in a if n in b and a[n] == b[n])
          diff = [n for n in a if n in b and a[n] != b[n]]
          only_a = [n for n in a if n not in b]
          print(f"官方条目 {len(a)}，本产物 {len(b)}，字节一致 {same}")
          for n in sorted(diff):
              print("  差异:", n)
          for n in sorted(only_a):
              print("  仅官方:", n)
          PY
          {
            echo ""
            echo "### 与官方 APK 的一致性"
            echo ""
            echo '```'
            cat /tmp/compare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pkg.outputs.artifact }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
